services:
  - type: web
    name: shopify-api
    env: python
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers ${WORKERS:-4} --loop uvloop
    envVars:
      - key: WORKERS
        value: "12"
      - key: PYTHON_VERSION
        value: "3.11.9"
